name: Update Project File Lists

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project file lists
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Scanning Files directory..."
          echo "========================================"

          if [ ! -d "Files" ]; then
            echo "ERROR: Files directory not found."
            exit 1
          fi

          find Files -mindepth 1 -maxdepth 1 -type d | sort | while read -r folder
          do
              echo ""
              echo "Processing: $folder"

              json_file="$folder/files.json"

              echo "{" > "$json_file"
              echo '    "files": [' >> "$json_file"

              first=true

              while IFS= read -r file
              do
                  filename=$(basename "$file")

                  case "$filename" in
                      *.pdf|*.PDF)

                          if [ "$first" = true ]; then
                              first=false
                          else
                              echo "," >> "$json_file"
                          fi

                          escaped=$(printf '%s' "$filename" | sed 's/\\/\\\\/g; s/"/\\"/g')

                          printf '        "%s"' "$escaped" >> "$json_file"

                          echo ""
                          echo "  Found PDF: $filename"

                          ;;
                  esac

              done < <(
                  find "$folder" -maxdepth 1 -type f \
                  ! -name "files.json" \
                  | sort -f
              )

              echo "" >> "$json_file"
              echo "    ]" >> "$json_file"
              echo "}" >> "$json_file"

              echo "Generated: $json_file"

          done

          echo ""
          echo "========================================"
          echo "File scanning complete."
          echo "========================================"

      - name: Show generated files
        shell: bash
        run: |
          echo "Generated files:"
          find Files -name "files.json" -print

          echo ""
          echo "Git status:"
          git status --short

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected."
          else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No changes detected."
          fi

      - name: Commit generated file lists
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Files/*/files.json

          git commit -m "Automatically update project file lists"

          git push
