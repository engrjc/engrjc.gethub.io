name: Update Project File Lists

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project file lists
        shell: bash
        run: |
          set -e

          echo "Scanning Files directory..."

          find Files -mindepth 1 -maxdepth 1 -type d | while read folder
          do
              echo "Processing: $folder"

              mkdir -p "$folder"

              json_file="$folder/files.json"

              echo "{" > "$json_file"
              echo '    "files": [' >> "$json_file"

              first=true

              find "$folder" -maxdepth 1 -type f \
                ! -name "files.json" \
                | sort -f \
                | while read file
              do
                  filename=$(basename "$file")

                  case "$filename" in
                      *.pdf|*.PDF)
                          if [ "$first" = true ]; then
                              first=false
                          else
                              echo "," >> "$json_file"
                          fi

                          escaped=$(printf '%s' "$filename" | sed 's/\\/\\\\/g; s/"/\\"/g')

                          printf '        "%s"' "$escaped" >> "$json_file"
                          ;;
                  esac
              done

              echo "" >> "$json_file"
              echo "    ]" >> "$json_file"
              echo "}" >> "$json_file"

              echo "Generated: $json_file"
          done

          echo "File scanning complete."

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
          else
              echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated file lists
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Files/*/files.json

          git commit -m "Automatically update project file lists"

          git push
